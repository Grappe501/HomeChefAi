[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_CONFIG_CACHE = "H:/HomeChefAi/.npm-cache"

[functions]
  node_bundler = "esbuild"

[functions."meals"]
  timeout = 26

[functions."receipts"]
  timeout = 26

[functions."assistant"]
  timeout = 26

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  autoLaunch = false

[context.production.environment]
  USE_DEV_STORE = "false"

[context.deploy-preview.environment]
  USE_DEV_STORE = "false"
