[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  VITE_API_BASE = "/.netlify/functions"
  VITE_SITE_URL = "https://home-chef-ai.netlify.app"
  VITE_APP_NAME = "HomeChef AI"
  VITE_ENABLE_BILLING = "false"
  ENABLE_BILLING = "false"

[functions]
  node_bundler = "esbuild"
  included_files = [
    "data/ai/dish-manifest.json",
    "data/ai/search/**",
    "data/ai/embeddings/**",
    "data/ai/deep/**",
    "data/ai/techniques/**",
    "data/ai/flavor_profiles/**",
    "data/ai/culture/**",
    "data/ai/food_sources/**",
    "data/ai/ingredients/**",
    "data/ai/cuisines/**",
    "data/marketing/**",
  ]

[functions."site-search"]
  timeout = 20

[functions."meals"]
  timeout = 26

[functions."receipts"]
  timeout = 26

[functions."assistant-stream"]
  timeout = 26

[functions."assistant"]
  timeout = 26

[functions."experience-plan"]
  timeout = 26

[functions."pantry-scan"]
  timeout = 26

[functions."cook-infer"]
  timeout = 20

[functions."knowledge"]
  timeout = 10

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  autoLaunch = false

[context.production.environment]
  USE_DEV_STORE = "false"

[context.deploy-preview.environment]
  USE_DEV_STORE = "false"
