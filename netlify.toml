[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  included_files = ["data/ai/**", "data/marketing/**"]

[functions."site-search"]
  timeout = 20

[functions."meals"]
  timeout = 26

[functions."receipts"]
  timeout = 26

[functions."assistant-stream"]
  timeout = 26

[functions."assistant"]
  timeout = 26

[functions."experience-plan"]
  timeout = 26

[functions."pantry-scan"]
  timeout = 26

[functions."cook-infer"]
  timeout = 20

[functions."knowledge"]
  timeout = 10

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  autoLaunch = false

[context.production.environment]
  USE_DEV_STORE = "false"

[context.deploy-preview.environment]
  USE_DEV_STORE = "false"
